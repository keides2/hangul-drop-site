name: CodeQL security analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL JavaScript security-extended
    runs-on: ubuntu-latest
    steps:
      - name: Check out public source
        uses: actions/checkout@v4
      # Explicit language selection is important: JavaScript is embedded in
      # index.html; automatic language detection can miss HTML-only projects.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Analyze HTML-embedded JavaScript
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:javascript-typescript'
