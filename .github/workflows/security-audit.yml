name: Public site security checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out public site source
        uses: actions/checkout@v4
      - name: Check for network, secret, and injection patterns
        run: python3 tests/security_audit.py
      - name: Verify exact CSP hashes and strict directives
        run: python3 tools/csp_hashes.py --check
      - name: Verify jamo notch geometry and invalid-placement rejection
        run: node tests/geometry_notch_regression.mjs

  csp-browser-regression:
    # Playwright 1.57 supports Ubuntu 24.04; ubuntu-latest currently resolves to 26.04.
    runs-on: ubuntu-24.04
    steps:
      - name: Check out public source
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Chromium test runner
        run: |
          python -m pip install 'playwright==1.57.0'
          python -m playwright install --with-deps chromium
      - name: Verify gameplay and blocked attacks under CSP
        run: python tests/csp_browser_smoke.py
      - name: Verify two-jamo recognition, batchim extension and timed clearing
        run: python tests/pairing_browser_regression.py
